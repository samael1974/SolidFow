name: SolidFlow Python syntax

on:
  push:
    paths:
      - 'SolidFlowUX/**/*.py'
      - 'tests/**'
      - '.github/workflows/python-syntax.yml'
  pull_request:
    paths:
      - 'SolidFlowUX/**/*.py'
      - 'tests/**'

jobs:
  pycompile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile SolidFlow sources
        run: python -m py_compile SolidFlowUX/*.py

      - name: Run headless UX regressions
        run: python -m unittest discover -s tests -v
